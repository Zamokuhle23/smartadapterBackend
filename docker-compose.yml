services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fundzaai
      POSTGRES_USER: fundza
      POSTGRES_PASSWORD: fundza
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundza -d fundzaai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      DATABASE_URL: postgres://fundza:fundza@db:5432/fundzaai
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "1"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://fundza:fundza@db:5432/fundzaai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media_data:
